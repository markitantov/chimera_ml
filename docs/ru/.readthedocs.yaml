# Read the Docs configuration for the Russian translation project.
# Configure this file as the Build configuration file for chimera-ml-ru.

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    post_install:
      - pip install poetry==2.3.2
      - VIRTUAL_ENV=$READTHEDOCS_VIRTUALENV_PATH poetry install --only main,docs --no-interaction

mkdocs:
  configuration: mkdocs.ru.yml
  fail_on_warning: true
