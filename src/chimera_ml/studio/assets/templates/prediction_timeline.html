<div class="studio-timeline"><div class="studio-timeline-controls"><label>Output <select data-studio-output>{% for output in output_names %}<option value="{{ output }}">{{ output }}</option>{% endfor %}</select></label>{% for source in legend %}<label><input type="checkbox" data-studio-source="{{ source.source }}" checked> {{ source.source }}</label>{% endfor %}</div><svg data-studio-timeline viewBox="0 0 {{ width }} {{ height }}" role="img" data-start="{{ minimum }}" data-end="{{ maximum }}" data-video-duration="{{ duration }}" data-plot-left="{{ left }}" data-plot-width="{{ plot_width }}">{% for axis in axes %}<g data-studio-axis-output="{{ axis.output }}" style="display:{{ axis.display }}"><line class="studio-axis-line" x1="{{ left }}" x2="{{ left }}" y1="{{ top }}" y2="{{ height - bottom }}" /><line class="studio-axis-line" x1="{{ left }}" x2="{{ width - right }}" y1="{{ height - bottom }}" y2="{{ height - bottom }}" /><text class="studio-axis-label" x="12" y="{{ top - 8 }}" font-size="12">{{ axis.output }}</text>{% for tick in axis.y_ticks %}<line class="studio-axis-tick" x1="{{ left - 4 }}" x2="{{ left }}" y1="{{ '%.3f'|format(tick.y) }}" y2="{{ '%.3f'|format(tick.y) }}" /><text class="studio-axis-number" x="{{ left - 8 }}" y="{{ '%.3f'|format(tick.y + 4) }}" text-anchor="end" font-size="11">{{ '%.3g'|format(tick.value) }}</text>{% endfor %}{% for tick in x_ticks %}<line class="studio-axis-tick" x1="{{ '%.3f'|format(tick.x) }}" x2="{{ '%.3f'|format(tick.x) }}" y1="{{ height - bottom }}" y2="{{ height - bottom + 4 }}" /><text class="studio-axis-number" x="{{ '%.3f'|format(tick.x) }}" y="{{ height - bottom + 18 }}" text-anchor="middle">{{ '%.3g'|format(tick.time) }}</text>{% endfor %}<text class="studio-axis-label" x="{{ (left + width - right) / 2 }}" y="{{ height - 8 }}" text-anchor="middle">time (s)</text></g>{% endfor %}<line data-studio-cursor class="studio-timeline-cursor" x1="{{ left }}" x2="{{ left }}" y1="{{ top }}" y2="{{ height - bottom }}" />{% for item in series %}<path data-studio-series data-source="{{ item.source }}" data-output="{{ item.output }}" data-points='{{ item.points_json }}' d="{{ item.path }}" class="studio-timeline-line" fill="none" stroke="{{ item.color }}" stroke-width="2" />{% if item.point_parts %}<g data-studio-series data-source="{{ item.source }}" data-output="{{ item.output }}" class="studio-timeline-points" fill="{{ item.color }}">{% for point in item.point_parts %}<circle cx="{{ '%.3f'|format(point.x) }}" cy="{{ '%.3f'|format(point.y) }}" r="4" />{% endfor %}</g>{% endif %}{% endfor %}<g data-studio-legend class="studio-timeline-legend" transform="translate(70,15)">{% for item in legend %}<rect x="{{ item.x }}" y="-10" width="12" height="12" fill="{{ item.color }}" /><text x="{{ item.x + 17 }}" y="0">{{ item.source }}</text>{% endfor %}</g></svg></div>
