<div class="studio-xai-timeline"><div class="studio-xai-timeline-controls"><span>XAI output</span><select data-studio-xai-output>{% for output in outputs %}<option value="{{ output }}">{{ output }}</option>{% endfor %}</select></div><svg data-studio-xai-timeline viewBox="0 {{ width }} {{ height }}" data-start="{{ start }}" data-end="{{ maximum }}" data-plot-left="{{ left }}" data-plot-width="{{ plot_width }}"><line data-studio-xai-zero class="studio-xai-zero-line" x1="{{ left }}" x2="{{ width - right }}" y1="{{ zero_y }}" y2="{{ zero_y }}" /><line data-studio-xai-cursor class="studio-xai-cursor" x1="{{ left }}" x2="{{ left }}" y1="{{ top }}" y2="{{ height - bottom }}" /><line class="studio-axis-line" x1="{{ left }}" x2="{{ left }}" y1="{{ top }}" y2="{{ height - bottom }}" /><line class="studio-axis-line" x1="{{ left }}" x2="{{ width - right }}" y1="{{ height - bottom }}" y2="{{ height - bottom }}" /><text class="studio-axis-label" x="12" y="{{ top - 8 }}">signed delta</text>{% for tick in ticks %}<line class="studio-axis-tick" x1="{{ '%.3f'|format(tick.x) }}" x2="{{ '%.3f'|format(tick.x) }}" y1="{{ height - bottom }}" y2="{{ height - bottom + 4 }}" /><text class="studio-axis-number" x="{{ '%.3f'|format(tick.x) }}" y="{{ height - bottom + 18 }}" text-anchor="middle">{{ '%.3g'|format(tick.time) }}</text><text class="studio-axis-number" x="{{ left - 8 }}" y="{{ '%.3f'|format(tick.y + 4) }}" text-anchor="end">{{ '%.3g'|format(tick.value) }}</text>{% endfor %}<text class="studio-axis-label" x="{{ (left + width - right) / 2 }}" y="{{ height - 8 }}" text-anchor="middle">time (s)</text>{% for item in series %}<path data-studio-xai-series data-source="{{ item.source }}" data-output="{{ item.output }}" data-points='{{ item.points_json }}' d="{{ item.path }}" class="studio-xai-line" fill="none" stroke="{{ item.color }}" stroke-width="2" />{% endfor %}</svg></div>
