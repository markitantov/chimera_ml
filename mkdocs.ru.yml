      - Пользовательские шаги предсказания: inference/custom-steps.md
      - Последовательные и параллельные конвейеры: inference/execution.md
      - Чекпоинты и артефакты: inference/checkpoints.md
      - Объяснимый ИИ (XAI): user-guide/xai.md
      - Устранение проблем: inference/troubleshooting.md
