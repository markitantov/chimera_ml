      - Пользовательские шаги инференса: extending/inference.md
  - Справочник:
      - Обзор: api/index.md
      - Конфигурация: user-guide/configuration.md
      - CLI: cli/reference.md
      - API ядра: api/core.md
      - API данных: api/data.md
      - API моделей: api/models.md
      - API обучения: api/training.md
      - API инференса: api/inference.md
      - API колбэков: api/callbacks.md
      - API функций потерь: api/losses.md
      - API метрик: api/metrics.md
      - API журналирования: api/logging.md
      - API плагинов: api/plugins.md
  - Разработка:
