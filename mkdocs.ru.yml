INHERIT: mkdocs.base.yml

site_name: Chimera ML — документация
site_url: https://chimera-ml.readthedocs.io/
edit_uri: edit/main/docs/ru/
docs_dir: docs/ru

theme:
  language: ru

nav:
  - Главная: index.md
  - Начало работы:
      - Обзор: getting-started/index.md
      - Установка: getting-started/installation.md
      - Быстрый старт: getting-started/quickstart.md
      - Первый эксперимент: getting-started/first-experiment.md
      - Основные понятия: getting-started/essential-concepts.md
  - Обучение:
      - Обзор: training/index.md
      - Подготовка данных: user-guide/data.md
      - Конфигурация эксперимента: user-guide/configuration.md
      - Обучение модели: user-guide/training.md
      - Оценка checkpoint: user-guide/evaluation.md
      - Callbacks: user-guide/callbacks.md
      - Logging и MLflow: user-guide/logging.md
      - MLflow: user-guide/mlflow.md
      - Hyperparameter sweeps: user-guide/sweeps.md
      - Диагностика: user-guide/troubleshooting.md
  - Inference:
      - Обзор: user-guide/inference.md
      - Запуск inference: inference/run.md
      - Конфигурация pipeline: inference/pipeline.md
      - Встроенные шаги inference: inference/built-in-steps.md
      - Пользовательские шаги предсказания: inference/custom-steps.md
      - Последовательные и параллельные pipeline: inference/execution.md
      - Чекпоинты и артефакты: inference/checkpoints.md
      - Объяснимый AI (XAI): user-guide/xai.md
      - Устранение проблем: inference/troubleshooting.md
  - Компоненты:
      - Обзор: components/index.md
      - Core:
          - Batch, ModelOutput и конфигурация: components/core.md
      - Data:
          - Datasets, DataModules и collates: components/data.md
      - Models:
          - Интерфейс моделей и built-ins: components/models.md
          - Обзор fusion architectures: components/fusion.md
          - TFS: user-guide/tfs-fusion.md
          - TFS-DCMMOE: user-guide/tfs-dcmmmoe-fusion.md
          - RAAV: user-guide/raav-fusion.md
          - TOMAR: user-guide/tomar-fusion.md
      - Компоненты обучения:
          - Losses, metrics, optimizers и schedulers: components/training.md
      - Callbacks:
          - Обзор: components/callbacks/index.md
          - Checkpointing: components/callbacks/checkpointing.md
          - Early stopping: components/callbacks/early-stopping.md
          - Snapshots, predictions, confusion matrices: components/callbacks/artifacts.md
          - Sweep objectives: components/callbacks/sweeps.md
          - Notifications: components/callbacks/notifications.md
      - Логгеры: components/logging.md
