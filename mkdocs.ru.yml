      - CLI: cli/reference.md
      - Core API: api/core.md
      - Data API: api/data.md
      - Models API: api/models.md
      - Training API: api/training.md
      - Inference API: api/inference.md
      - Callbacks API: api/callbacks.md
      - Losses API: api/losses.md
      - Metrics API: api/metrics.md
      - Logging API: api/logging.md
      - Plugins API: api/plugins.md
  - Разработка:
      - Обзор: development/index.md
      - Архитектура: development/architecture.md
      - Setup: development/setup.md
      - Testing: development/testing.md
      - Documentation: development/documentation.md
      - Changelog: releases/changelog.md
      - Migration guide: releases/migration.md
      - Releasing: development/releasing.md
      - Релизы: releases/index.md
