      - Обзор: components/index.md
      - Ядро:
          - Batch, ModelOutput и конфигурация: components/core.md
      - Данные:
          - Datasets, DataModules и collates: components/data.md
      - Модели:
          - Интерфейс моделей и встроенные реализации: components/models.md
          - Обзор архитектур слияния: components/fusion.md
          - TFS: user-guide/tfs-fusion.md
          - TFS-DCMMOE: user-guide/tfs-dcmmmoe-fusion.md
