[project]
name = "chimera-ml"
version = "0.3.2"
description = "Chimera ML (Cross-modal Hierarchical Merging of Embeddings and Representations) - a lightweight training framework for configurable uni-modal and multi-modal experiments."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Maxim Markitantov", email = "m.markitantov@yandex.ru" }]
keywords = ["machine-learning", "pytorch", "multimodal", "training", "deep-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "torch>=2.4,<3.0; python_version < \"3.13\"",
    "torch>=2.6,<3.0; python_version == \"3.13\"",
    "torch>=2.9,<3.0; python_version >= \"3.14\"",
    "tqdm>=4.66,<5.0",
    "numpy>=1.26,<3.0; python_version < \"3.13\"",
    "numpy>=2.1,<3.0; python_version == \"3.13\"",
    "numpy>=2.3,<3.0; python_version >= \"3.14\"",
    "pyyaml>=6.0.1,<7.0; python_version < \"3.13\"",
    "pyyaml>=6.0.2,<7.0; python_version >= \"3.13\"",
    "typer>=0.16,<1.0",
    "matplotlib>=3.8,<4.0; python_version < \"3.13\"",
    "matplotlib>=3.9,<4.0; python_version == \"3.13\"",
    "matplotlib>=3.10,<4.0; python_version >= \"3.14\"",
    "mlflow>=2.22,<3.0; python_version < \"3.14\"",
    "mlflow>=3.0,<4.0; python_version >= \"3.14\"",
    "pyarrow>=19,<20; python_version < \"3.14\"",
    "pyarrow>=22,<23; python_version >= \"3.14\"",
    "optuna>=4.0,<5.0",
    "requests>=2.31,<3.0",
]

[project.optional-dependencies]
studio = ["gradio>=6.0,<7.0", "jinja2>=3.1"]

[project.scripts]
chimera_ml = "chimera_ml.cli:app"
"chimera-ml" = "chimera_ml.cli:app"

[tool.poetry]
packages = [{ include = "chimera_ml", from = "src" }]

include = [
  { path = "src/chimera_ml/studio/assets/templates/*.html", format = ["sdist", "wheel"] },
  { path = "src/chimera_ml/studio/assets/css/*.css", format = ["sdist", "wheel"] },
  { path = "src/chimera_ml/studio/assets/js/*.js", format = ["sdist", "wheel"] },
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2,<9.0"
pytest-cov = ">=5.0,<6.0"
ruff = ">=0.5.0,<1.0"
pre-commit = ">=3.7,<4.0"
scikit-learn = ">=1.4,<2.0"

[tool.poetry.group.docs.dependencies]
mkdocs = ">=1.6,<2.0"
mkdocs-material = ">=9.5,<10.0"
mkdocstrings = ">=0.25,<1.0"
mkdocstrings-python = ">=1.10,<2.0"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv-exp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PIE", "RET", "RUF", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --disable-warnings"

[tool.coverage.run]
source = ["src/chimera_ml"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
