# Read the Docs configuration for the MkDocs documentation site.
# See https://docs.readthedocs.com/platform/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    pre_install:
      - pip install poetry==2.3.2
    install:
      - poetry config virtualenvs.create false
      - poetry install --only main,docs --no-interaction

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true
