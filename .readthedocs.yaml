# Read the Docs configuration for the English documentation project.
# See https://docs.readthedocs.com/platform/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    post_install:
      - pip install poetry==2.3.2
      - VIRTUAL_ENV=$READTHEDOCS_VIRTUALENV_PATH poetry install --only main,docs --no-interaction

mkdocs:
  configuration: mkdocs.en.yml
  fail_on_warning: true
