name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - feat/studio
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --with dev,docs --extras studio

      - name: Check installed dependencies
        run: poetry run pip check

      - name: Show resolved runtime versions
        run: poetry run python -c "import mlflow, numpy, torch; print(\"python=\", __import__(\"sys\").version); print(\"torch=\", torch.__version__); print(\"numpy=\", numpy.__version__); print(\"mlflow=\", mlflow.__version__)"

      - name: Poetry Check
        run: poetry check

      - name: Pre-commit
        run: poetry run pre-commit run --all-files

      - name: Pytest
        run: poetry run pytest -q

      - name: Ruff lint
        run: poetry run ruff check .

      - name: Ruff format
        run: poetry run ruff format --check src tests

      - name: Studio CLI
        run: poetry run chimera-ml studio --help

      - name: Build documentation
        run: poetry run mkdocs build --strict --config-file mkdocs.en.yml

      - name: Build Russian documentation
        run: poetry run mkdocs build --strict --config-file mkdocs.ru.yml

      - name: Build package
        run: poetry build

  dependency-modes:
    name: ${{ matrix.mode }} / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        mode: ["minimum", "latest"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install direct dependencies
        run: |
          if [[ "${{ matrix.python-version }}" == "3.13" ]]; then sklearn='scikit-learn>=1.5,<2'; elif [[ "${{ matrix.python-version }}" == "3.14" ]]; then sklearn='scikit-learn>=1.7,<2'; else sklearn='scikit-learn>=1.4,<2'; fi
          uv pip install --system --resolution ${{ matrix.mode == 'minimum' && 'lowest-direct' || 'highest' }} -e '.[studio]' 'pytest>=8.2,<9' 'pytest-cov>=5,<6' "$sklearn"
      - name: Verify core-only installation
        run: |
          python -m venv /tmp/chimera-core
          /tmp/chimera-core/bin/pip install .
          /tmp/chimera-core/bin/pip check
          /tmp/chimera-core/bin/python -c "import importlib.util; import chimera_ml; raise SystemExit(1 if importlib.util.find_spec('gradio') else 0)"
      - name: Dependency check
        run: python -m pip check
      - name: Show resolved runtime versions
        run: python -c "import mlflow, numpy, torch; print(\"python=\", __import__(\"sys\").version); print(\"torch=\", torch.__version__); print(\"numpy=\", numpy.__version__); print(\"mlflow=\", mlflow.__version__)"
      - name: Pytest
        run: pytest -q
      - name: Studio CLI
        run: chimera-ml studio --help
